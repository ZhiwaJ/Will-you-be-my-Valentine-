<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be My Valentine?</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1 class="header_text">
            Hi <span style="color: #60A5FA; text-shadow: 2px 2px 4px #1E3A8A;">HAVAND</span>,<br> Will YOU go on a DATE with me?
        </h1>
        <div class="buttons">
            <button class="yes-button" onclick="handleYesClick()">Yes</button>
            <button class="no-button" onclick="handleNoClick()">No</button>
        </div>
        <div class="gif_container">
            <!-- Swapped for a highly reliable Tenor GIF link -->
            <img src="https://media.tenor.com/B94XgA7EaM0AAAAC/cat-pleading.gif" alt="Cute Pleading Cat GIF">
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
